<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Button tests</title>
	<script src="../src/button.js"></script>
</head>
<body>
	<div id="container"></div>
	<script type="module">
		import { runTests } from "@web/test-runner-mocha";
		import { assert } from "./assert.js";

		class CallbackManager {
			constructor() {
				// Creates async button with HTML
				const container = document.getElementById("container");
				container.innerHTML += `<button is="async-button">Click Me!</button>`;
				this.btn = /** @type {HTMLButtonElement} */(container.lastElementChild);

				// Creates async callback we can know when it resolves and how many times it was called
				/** @type {Promise<void>|null} */
				this.next = null;
				this.counter = 0;
				this.callback = (event) => {
					assert(event instanceof Event);
					assert(this.btn.getAttribute("aria-working"));
					this.counter++;
					this.next = Promise.resolve();
					return this.next;
				};
			}

			// Waits until async callback has resolved and returns how many times the callback was called
			async called(working) {
				assert(this.next);
				await this.next;
				this.next = null;
				assert(!!this.btn.getAttribute("aria-working") === !!working);
				return this.counter;
			}
		}

		runTests(() => {
			test("webserial availability indicator", async () => {
				assert(document.querySelector("html").classList.contains("webserial-available"));
			});

			test("click event listener", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.click();
				assert(await cbm.called() === 1);
				cbm.btn.click();
				assert(await cbm.called() === 2);
			});
			
			test("click event property", async () => {
				const cbm = new CallbackManager();
				cbm.btn.onclick = cbm.callback;
				cbm.btn.click();
				assert(await cbm.called() === 1);
				cbm.btn.click();
				assert(await cbm.called() === 2);
			});

			test("non click event listener", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("pointerdown", cbm.callback);
				cbm.btn.dispatchEvent(new Event("pointerdown"));
				assert(await cbm.called() === 1);
				cbm.btn.dispatchEvent(new Event("pointerdown"));
				assert(await cbm.called() === 2);
			});

			test("non click event property", async () => {
				const cbm = new CallbackManager();
				cbm.btn.onpointerdown = cbm.callback;
				cbm.btn.dispatchEvent(new Event("pointerdown"));
				assert(await cbm.called() === 1);
				cbm.btn.dispatchEvent(new Event("pointerdown"));
				assert(await cbm.called() === 2);
			});

			test("once click event", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback, { once: true });
				cbm.btn.click();
				assert(await cbm.called() === 1);
				cbm.btn.click();
				assert(cbm.next === null);
				assert(cbm.counter === 1);
			});

			test("unregister event listener", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.click();
				assert(await cbm.called() === 1);
				cbm.btn.removeEventListener("click", cbm.callback);
				cbm.btn.click();
				assert(cbm.next === null);
				assert(cbm.counter === 1);
			});

			test("unregister event property", async () => {
				const cbm = new CallbackManager();
				cbm.btn.onclick = cbm.callback;
				cbm.btn.click();
				assert(await cbm.called() === 1);
				cbm.btn.onclick = null;
				cbm.btn.click();
				assert(cbm.next === null);
				assert(cbm.counter === 1);
			});

			test("unregister not registered listener", async () => {
				const cbm = new CallbackManager();
				cbm.btn.removeEventListener("click", cbm.callback);
			});

			test("multi register same type", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", (event) => cbm.callback(event));
				cbm.btn.addEventListener("click", (event) => cbm.callback(event));
				cbm.btn.click();
				assert(await cbm.called() === 2);
			});

			// Registering the same callback for the same event multiple times still only calls it once
			test("multi register identical", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.click();
				assert(await cbm.called() === 1);
			});

			test("multiple register different types", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.addEventListener("pointerdown", cbm.callback);
				cbm.btn.click();
				cbm.btn.dispatchEvent(new Event("pointerdown"));
				assert(await cbm.called() === 2);
			});

			test("caller context", async () => {
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", function (event) {
					assert(this === cbm.btn);
					cbm.callback(event);
				});
				cbm.btn.click();
				assert(await cbm.called() === 1);
			});

			test("handler context", async () => {
				const cbm = new CallbackManager();
				const handler = {
					handleEvent: function (event) {
						assert(this === handler);
						cbm.callback(event);
					}
				};
				cbm.btn.addEventListener("click", handler);
				cbm.btn.click();
				assert(await cbm.called() === 1);
			});

			test("invalid callback argument undefined", async () => {
				const cbm = new CallbackManager();
				assert.throws(() => {
					// @ts-expect-error
					cbm.btn.addEventListener("click");
				});
			});

			test("invalid callback argument number", async () => {
				const cbm = new CallbackManager();
				assert.throws(() => {
					// @ts-expect-error
					cbm.btn.addEventListener("click", 1337);
				});
			});

			test("callback argument empty object", async () => {
				const cbm = new CallbackManager();
				// @ts-expect-error
				cbm.btn.addEventListener("click", {});
				cbm.btn.click();
			});

			test("event property getter", () => {
				const cbm = new CallbackManager();
				cbm.btn.onclick = cbm.callback;
				assert(cbm.btn.onclick === cbm.callback);
			});

			test("overlapping callbacks", async () => {
				// Promise that resolves after callback manager callback
				const promise = new Promise((resolve) => setTimeout(resolve));

				// Registers callback manager callback and asserts that button is still "working"
				const cbm = new CallbackManager();
				cbm.btn.addEventListener("click", cbm.callback);
				cbm.btn.addEventListener("click", async () => promise);
				cbm.btn.click();
				assert(await cbm.called(true) === 1);

				// Waits for second promise to settle and asserts that "working" state resets
				await promise;
				await Promise.resolve();
				assert(!cbm.btn.getAttribute("aria-working"));
			});
		});
	</script>
</body>
</html>
