<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Simple example</title>
	<style>
		body {
			background: #eee;
		}
	</style>
</head>
<body>
	<p>Reads single NVS configurations from device over USB and outputs it as JSON</p>
	<button id="read">Read</button>
	<span id="no-support" hidden>WebSerial not supported</span>
	<pre id="available" hidden>Output available in the developer console</pre>
	<script type="module">
		import { NVS } from "../src/nvs.js";

		const btn = document.getElementById("read");

		if (!("serial" in navigator)) {
			btn.disabled = true;
			document.getElementById("no-support").hidden = false;
		}

		btn.addEventListener("click", async () => {
			const nvs = new NVS(await navigator.serial.requestPort());
			const chan = await nvs.get("nvs.net80211", "sta.chan");
			console.log("WiFi station channel is", chan);
			document.getElementById("available").hidden = false;
		});
	</script>
</body>
</html>
