<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Table example</title>
	<link rel="stylesheet" href="../src/table.css">
	<style>
		body {
			background: #eee;
		}
		.nvs {
			margin: 1em;
			background: white;
		}
	</style>
</head>
<body>
	<p>Reads all NVS configurations from device over USB and puts it in a table</p>
	<button id="read">Read</button>
	<span id="no-support" hidden>WebSerial not supported</span>
	<script type="module">
		import { NVS } from "../src/nvs.js";

		const btn = document.getElementById("read");

		if (!("serial" in navigator)) {
			btn.disabled = true;
			document.getElementById("no-support").hidden = false;
		}

		btn.addEventListener("click", async () => {
			const nvs = new NVS(await navigator.serial.requestPort());
			await nvs.all();
			document.body.appendChild(nvs.toHTML());
		});
	</script>
</body>
</html>
