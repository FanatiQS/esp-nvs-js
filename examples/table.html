<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Table example</title>
	<link rel="stylesheet" href="../src/table.css">
	<style>
		body {
			background: #eee;
		}
		.nvs-table {
			background: white;
		}
	</style>
	<link rel="stylesheet" href="../src/button.css">
	<script src="../src/button.js"></script>
</head>
<body>
	<p>Reads all NVS configurations from device over USB and puts it in a table</p>
	<button id="read" is="async-button">Read</button>
	<span class="webserial-unsupported-message">WebSerial not supported</span>
	<script type="module">
		import { NVS } from "../src/nvs.js";

		document.getElementById("read").addEventListener("click", async () => {
			const nvs = new NVS(await navigator.serial.requestPort());
			await nvs.all();
			document.body.appendChild(nvs.toHTML());
		});
	</script>
</body>
</html>
