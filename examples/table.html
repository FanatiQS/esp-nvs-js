<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="/table.css">
	<style>
		body {
			background: #eee;
		}
		.nvs {
			background: white;
		}
	</style>
	<title>Table example</title>
</head>
<body>
	<button id="read">Read</button>
	<span id="no-support" hidden>WebSerial not supported</span>
	<script type="module">
		// @ts-check

		import { NVS } from "../nvs.js";

		const btn = document.getElementById("read");

		if (!("serial" in navigator)) {
			btn.disabled = true;
			document.getElementById("no-support").hidden = false;
		}

		btn.addEventListener("click", async () => {
			const nvs = new NVS(await navigator.serial.requestPort());
			await nvs.all();
			document.body.appendChild(nvs.toHTML());
		});
	</script>
</body>
</html>
