<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Iterator example</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/FanatiQS/esp-nvs-js@master/src/button.css">
	<script src="https://cdn.jsdelivr.net/gh/FanatiQS/esp-nvs-js@master/src/button.js"></script>
</head>
<body>
	<p>Reads SoftAP configuration from device over USB</p>
	<button id="read" is="async-button">Read</button>
	<span class="webserial-unsupported-message">⚠ WebSerial not supported</span>
	<pre>Output available in the developer console</pre>

	<script type="module">
		import { NVS } from "https://cdn.jsdelivr.net/gh/FanatiQS/esp-nvs-js@master/src/nvs.js";

		document.getElementById("read").addEventListener("click", async () => {
			const nvs = new NVS(await navigator.serial.requestPort());

			// Filters out only SoftAP parameters
			for await (const [ namespace, key, value ] of nvs) {
				if (namespace === "nvs.net80211" && key.startsWith("ap.")) {
					console.log(key, value);
				}
			}
		});
	</script>
</body>
</html>
